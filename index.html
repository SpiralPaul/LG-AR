<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leyton Group – AR Staircase Viewer</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bar: 56px; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f2f2f2; }
  #top { position: fixed; top: 0; left: 0; right: 0; z-index: 3; box-sizing: border-box; height: calc(var(--bar) + env(safe-area-inset-top, 0px));
         padding: env(safe-area-inset-top, 0px) 14px 0; background: #1a1a1a; display: flex; align-items: center; justify-content: space-between; }
  #logolink { display: flex; max-width: 55%; } #logo { height: 24px; max-width: 100%; object-fit: contain; }
  #meas { padding: 8px 16px; border: 1px solid #fff; border-radius: 20px; color: #fff; text-decoration: none; font-size: .9rem; }
  model-viewer { position: fixed; left: 0; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); width: 100%; height: calc(100% - var(--bar) - env(safe-area-inset-top, 0px)); --poster-color: transparent; }
  #msg { padding: 5rem 2rem; text-align: center; }
  #ar { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); padding: 14px 28px;
        font-size: 1rem; border: 0; border-radius: 28px; background: #1a1a1a; color: #fff; white-space: nowrap; }
  #hint { position: fixed; top: calc(var(--bar) + env(safe-area-inset-top, 0px) + 8px); width: 100%; text-align: center; font-size: .85rem; color: #555; pointer-events: none; z-index: 2; }
  #scale { position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 4px;
           padding: 4px; border-radius: 24px; background: rgba(255,255,255,.92); box-shadow: 0 1px 6px rgba(0,0,0,.2); font-size: .85rem; }
  #scale span { padding: 0 8px 0 12px; color: #555; }
  #scale button { font: inherit; border: 0; border-radius: 20px; padding: 9px 16px; background: transparent; color: #1a1a1a; min-width: 56px; }
  #scale button.on { background: #1a1a1a; color: #fff; }
</style>
</head>
<body>
<header id="top"><a id="meas" hidden>Measure</a><a id="logolink" href="https://leytongroup.com/" target="_blank" rel="noopener"><img id="logo" src="logo.png" alt="Leyton Group"></a></header>
<div id="msg" hidden>No model specified. Use a link like <b>?m=01/MAYA_DERIVE_AR-01</b></div>
<model-viewer id="mv" alt="Staircase 3D model" ar ar-modes="webxr scene-viewer quick-look"
  ar-placement="floor" camera-controls touch-action="none" auto-rotate orbit-sensitivity="2" interpolation-decay="100" interaction-prompt="none" shadow-intensity="1"
  environment-image="neutral" exposure="1.1" camera-orbit="30deg 75deg 70%" min-camera-orbit="auto 0deg 3%" max-camera-orbit="auto 180deg 250%">
  <button id="ar" slot="ar-button">View in AR</button>
</model-viewer>
<div id="hint">Drag to spin &middot; pinch to zoom<br><span id="dims"></span></div>
<div id="scale"><span>AR scale</span><button data-s="" class="on">1:10</button><button data-s="_1to1">1:1</button></div>
<script>
  const mv = document.getElementById('mv');
  const GESTURE_TARGET = mv;
  const zoomBy = k => { const o = mv.getCameraOrbit(); mv.cameraOrbit = `${o.theta}rad ${o.phi}rad ${o.radius * k}m`; };
  const panBy = (dx, dy) => {   // move the point the model turns around, along the screen's right/up directions
    const o = mv.getCameraOrbit(), t = mv.getCameraTarget(), per = 2 * o.radius * Math.tan(mv.getFieldOfView() * Math.PI / 360) / mv.clientHeight,
      r = [Math.cos(o.theta), 0, -Math.sin(o.theta)], f = [-Math.sin(o.phi) * Math.sin(o.theta), -Math.cos(o.phi), -Math.sin(o.phi) * Math.cos(o.theta)],
      u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
    mv.cameraTarget = [0, 1, 2].map(k => [t.x, t.y, t.z][k] + r[k] * dx * per - u[k] * dy * per + 'm').join(' ');
  };
  // ---- trackpad gestures (laptops): pinch = zoom, two-finger swipe = pan, mouse wheel = zoom; Ctrl + wheel always zooms ----
  let lastWheel = 0, burst = 0;
  document.addEventListener('wheel', e => {
    if (!e.composedPath().includes(GESTURE_TARGET)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    const now = performance.now(); burst = now - lastWheel < 40 ? burst + 1 : 0; lastWheel = now;
    const mouseWheel = !e.ctrlKey && burst < 3 && (e.deltaMode !== 0 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 100 && (e.deltaY % 100 === 0 || e.deltaY % 120 === 0)));
    if (e.ctrlKey) zoomBy(Math.exp(e.deltaY * 0.012));            // pinch on the trackpad
    else if (mouseWheel) zoomBy(Math.exp(e.deltaY * 0.0015));     // mouse wheel
    else panBy(e.deltaX, e.deltaY);                               // two-finger swipe
  }, { capture: true, passive: false });
  
  const q = new URLSearchParams(location.search);
  if (q.get('resize') === 'off') mv.setAttribute('ar-scale', 'fixed');   // add &resize=off to a link to stop pinch-resizing in AR
  const m = q.get('m')?.replace(/[^\w./-]/g, '').replace(/\.\./g, '');
  if (!m) { mv.hidden = true; document.getElementById('scale').hidden = true; document.getElementById('msg').hidden = false; }
  else {
    const base = m.includes('/') ? m : `models/${m}`;   // ?m=01/NAME uses folder 01, ?m=NAME uses models/
    // NAME.glb/.usdz = 1:10 table-top (starting view), NAME_1to1.glb/.usdz = full size
    const dimsEl = document.getElementById('dims'), mm = v => Math.round(v * 1000).toLocaleString('en-GB');
    let lab = '1:10', keep = null;
    mv.addEventListener('load', () => {
      const d = mv.getDimensions(); dimsEl.textContent = `Size in AR at ${lab}: ${mm(d.x)} × ${mm(d.y)} × ${mm(d.z)} mm (W × H × D)`;
      if (lab === '1:1' && keep) {   // same camera position as the 1:10 view, so the stair appears 10x larger; pinch out to see all of it
        mv.minCameraOrbit = 'auto 0deg 0.05m'; mv.maxCameraOrbit = 'auto 180deg 60m';
        mv.cameraOrbit = `${keep.theta}rad ${keep.phi}rad ${keep.radius}m`; mv.jumpCameraToGoal();
      } else { mv.minCameraOrbit = 'auto 0deg 3%'; mv.maxCameraOrbit = 'auto 180deg 250%'; mv.cameraOrbit = '30deg 75deg 70%'; mv.jumpCameraToGoal(); }
    });
    const setScale = s => {
      const to = s ? '1:1' : '1:10'; if (mv.loaded && to === lab) return;
      keep = (mv.loaded && to === '1:1') ? mv.getCameraOrbit() : null; lab = to;
      mv.src = `${base}${s}.glb`; mv.setAttribute('ios-src', `${base}${s}.usdz`);
      document.querySelectorAll('#scale button').forEach(b => b.classList.toggle('on', b.dataset.s === s)); };
    document.querySelectorAll('#scale button').forEach(b => b.onclick = () => setScale(b.dataset.s));
    setScale('');
    document.title = m.split('/').pop();
    const a = document.getElementById('meas'); a.href = 'measure.html?m=' + encodeURIComponent(m); a.hidden = false;
  }
</script>
</body>
</html>
