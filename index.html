<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leyton Group – AR Staircase Viewer</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f2f2f2; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  #msg { padding: 2rem; text-align: center; }
  #ar { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 14px 28px;
        font-size: 1rem; border: 0; border-radius: 28px; background: #1a1a1a; color: #fff; }
  #meas { position: absolute; top: 10px; right: 12px; padding: 8px 16px; border-radius: 20px; background: #1a1a1a; color: #fff; text-decoration: none; font-size: .9rem; z-index: 2; }
  #hint { position: absolute; top: 12px; width: 100%; text-align: center; font-size: .85rem; color: #555; pointer-events: none; }
</style>
</head>
<body>
<div id="msg" hidden>No model specified. Use a link like <b>?m=MAYA_DERIVE_AR-02</b></div>
<model-viewer id="mv" alt="Staircase 3D model" ar ar-modes="webxr scene-viewer quick-look"
  ar-placement="floor" camera-controls touch-action="pan-y" auto-rotate shadow-intensity="1"
  environment-image="neutral" exposure="1.1" min-camera-orbit="auto auto 0.2m">
  <button id="ar" slot="ar-button">View on your table in AR</button>
  <div id="hint">Drag to spin &middot; pinch to zoom</div>
</model-viewer>
<a id="meas" hidden>Measure</a>
<script>
  const mv = document.getElementById('mv');
  const q = new URLSearchParams(location.search);
  if (q.get('resize') !== 'on') mv.setAttribute('ar-scale', 'fixed');   // locks the 1:20 size; add &resize=on to the link to allow pinch-resizing
  const m = q.get('m')?.replace(/[^\w./-]/g, '').replace(/\.\./g, '');
  if (!m) { mv.hidden = true; document.getElementById('msg').hidden = false; }
  else { const base = m.includes('/') ? m : `models/${m}`;   // ?m=01/NAME uses folder 01, ?m=NAME uses models/
  mv.src = `${base}.glb`; mv.setAttribute('ios-src', `${base}.usdz`); document.title = m.split('/').pop();
    const a = document.getElementById('meas'); a.href = 'measure.html?m=' + encodeURIComponent(m); a.hidden = false; }
</script>
</body>
</html>
